[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradegame-rl"
version = "0.1.0"
description = "A turn-based trading game with a clean core for human play and reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "TradeGame-RL contributors" }]
dependencies = []

[project.scripts]
trade-game = "trade_game.ui.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["arcade>=3.3,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["trade_game*"]

[tool.setuptools.package-data]
"trade_game.core.data" = ["*.csv", "*.toml"]
