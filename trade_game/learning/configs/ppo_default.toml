[training]
updates = 100
seed = 7
device = "cpu"
evaluation_interval = 10
evaluation_seeds = [101, 103, 107, 109, 113]
tensorboard_log_dir = "runs/tensorboard"

[observation]
market_history_offsets = [6, 4, 2, 0]

[ppo]
gamma = 0.995
gae_lambda = 0.95
rollout_steps = 512
ppo_epochs = 4
minibatch_size = 64
learning_rate = 0.0003
clip_range = 0.2
value_clip_range = 0.2
value_coefficient = 0.5
entropy_coefficient = 0.01
max_grad_norm = 0.5
target_kl = 0.03
normalize_advantages = true

[encoder]
global_dim = 64
city_dim = 64
product_dim = 96
market_dim = 128
route_dim = 128
cargo_dim = 96
fusion_hidden_dim = 256
state_dim = 128
hidden_dim = 128
dropout = 0.0
