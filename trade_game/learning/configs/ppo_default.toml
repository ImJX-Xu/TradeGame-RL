[training]
updates = 100
seed = 7
device = "cpu"
evaluation_interval = 10
evaluation_seeds = [101, 103, 107, 109, 113]
tensorboard_log_dir = "runs/tensorboard"

[ppo]
gamma = 0.995
gae_lambda = 0.95
rollout_steps = 512
ppo_epochs = 4
minibatch_size = 64
learning_rate = 0.0003
clip_range = 0.2
value_clip_range = 0.2
value_coefficient = 0.5
entropy_coefficient = 0.01
max_grad_norm = 0.5
target_kl = 0.03
normalize_advantages = true

[encoder]
embedding_dim = 16
entity_dim = 64
state_dim = 128
hidden_dim = 128
dropout = 0.0
