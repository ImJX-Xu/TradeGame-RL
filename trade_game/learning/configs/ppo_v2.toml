[training]
updates = 200
seed = 7
device = "cpu"
environment_count = 8
evaluation_interval = 50
evaluation_seeds = [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157, 163, 167, 173, 179]
tensorboard_flush_interval = 10
checkpoint_path = "runs/ppo_v2_parallel_100k/ppo_v2.pt"
tensorboard_log_dir = "runs/ppo_v2_parallel_100k/tensorboard"

[ppo]
gamma = 0.995
gae_lambda = 0.95
rollout_steps = 64
ppo_epochs = 4
minibatch_size = 64
learning_rate = 0.0003
final_learning_rate = 0.0001
clip_range = 0.2
value_clip_range = 0.2
value_coefficient = 0.5
entropy_coefficient = 0.01
final_entropy_coefficient = 0.002
max_grad_norm = 0.5
target_kl = 0.08
initial_target_kl = 0.01
normalize_advantages = true

[encoder]
embedding_dim = 16
entity_dim = 64
state_dim = 128
hidden_dim = 128
dropout = 0.0
